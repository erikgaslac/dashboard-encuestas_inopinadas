<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuestas Inopinadas · Dashboard Ejecutivo de Supervisión Docente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --ink:#0E1726; --ink2:#1E2A3D; --canvas:#F4F6F9; --card:#FFFFFF; --line:#E1E6ED;
  --muted:#6B7787; --muted2:#95A0AE;
  --zegel:#E5591D; --idat:#EC8FCA; --ca:#111111;
  --exc:#12B94A; --bue:#C9B70A; --seg:#F0A81C; --cri:#DC3A3A;
  --accent:#1E63C8;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
.app{display:flex;min-height:100vh}
/* rail */
.rail{width:212px;flex:0 0 212px;background:var(--ink);color:#DDE4EE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail .brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.rail .brand b{display:block;font-size:13px;letter-spacing:.02em;color:#fff}
.rail .brand span{display:block;font-size:10.5px;color:#8FA0B6;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav a{display:flex;gap:10px;align-items:baseline;padding:9px 10px;border-radius:8px;color:#B9C5D6;text-decoration:none;cursor:pointer;font-size:12.5px;line-height:1.2}
.nav a .nu{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#61748C}
.nav a .nu{color:#61748C}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:#fff;color:var(--ink);font-weight:600}
.nav a.on .nu{color:var(--accent)}
.railfoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#7D8CA1;line-height:1.5}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;position:sticky;top:0;z-index:30}
.tb1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb1 h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.tb1 .sub{color:var(--muted);font-size:11.5px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;color:var(--ink2)}
.btn:hover{border-color:#B9C4D2;background:#FAFBFD}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:600}
.f select,.f input{font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-width:118px;max-width:190px}
.f select:focus,.f input:focus{outline:2px solid #C6DAFB;border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;min-height:0}
.chip{background:#EAF1FC;color:#17457F;border:1px solid #CFE0F7;border-radius:999px;padding:3px 9px;font-size:11px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600}
.chip i{cursor:pointer;font-style:normal;opacity:.6}
.chip i:hover{opacity:1}
.page{padding:20px 22px 46px;display:none}
.page.on{display:block}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 0 11px;font-weight:600;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.card h3{margin:0 0 3px;font-size:12.5px;font-weight:600}
.card .hint{color:var(--muted);font-size:10.5px;margin:0 0 10px;line-height:1.45}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative;overflow:hidden}
.kpi .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:600}
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:5px}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.g:before{background:var(--exc)}.kpi.y:before{background:var(--bue)}.kpi.o:before{background:var(--seg)}.kpi.r:before{background:var(--cri)}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px}.chartbox.lg{height:330px}.chartbox.xl{height:420px}
/* table */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.num,table.t td.num{text-align:right}
table.t td{padding:7px 8px;border-bottom:1px solid #F1F4F8;vertical-align:top}
table.t tbody tr:hover{background:#FAFBFD}
.scroll{max-height:430px;overflow:auto}
.scroll.h300{max-height:300px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap}
.t-exc{background:#E4F8EA;color:#0B7A31}.t-bue{background:#FBF6D6;color:#7A6C05}
.t-seg{background:#FDEFD8;color:#8A5606}.t-cri{background:#FBE3E3;color:#9E1F1F}
.bar{height:6px;background:#EDF1F6;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
/* heatmap */
.hm{overflow:auto}
table.hm{border-collapse:separate;border-spacing:2px;font-size:11px}
table.hm th{font-size:9.5px;font-weight:600;color:var(--muted);text-align:left;padding:3px 6px;white-space:nowrap}
table.hm th.rot{writing-mode:vertical-rl;transform:rotate(180deg);text-align:right;height:110px;padding:4px 2px}
table.hm td{padding:6px 8px;text-align:center;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;min-width:44px}
/* insights */
.ins{display:grid;gap:9px}
.ins .i{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px}
.ins .i .lb{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:600;margin-bottom:3px}
.ins .i .tx{font-size:12.5px;line-height:1.5}
.ins .i .ev{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
.ins .i.pos{border-left-color:var(--exc)}.ins .i.neg{border-left-color:var(--cri)}.ins .i.warn{border-left-color:var(--seg)}
.rec{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.rec .rh{padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.rec.alta .rh{background:var(--cri)}.rec.media .rh{background:var(--seg)}.rec.baja .rh{background:#5B7A9B}
.rec .rb{padding:4px 12px 10px}
.rec .r1{padding:9px 0;border-bottom:1px solid #F1F4F8;font-size:12px;line-height:1.5}
.rec .r1:last-child{border-bottom:0}
.rec .r1 b{display:block;font-size:12.5px;margin-bottom:3px}
.rec .r1 .m{color:var(--muted);font-size:11px}
.txt{font-size:11.5px;line-height:1.55;color:var(--ink2)}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.note{background:#FFF8E6;border:1px solid #F1E0AE;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.55;color:#6B5406}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1250px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
@media print{.rail,.topbar .filters,.btn{display:none}.page{display:block!important;break-before:page}}
</style>
</head>

anteriores y de las evaluaciones programadas. Asimismo, verifica el avance de los estudiantes y resuelve las dudas presentadas por los alumnos.", "opm": "-", "com": "-", "tm": [], "sinOpm": 1}, {"ts": "2026-05-28", "ym": "2026-05", "hh": 13, "marca": "Zegel", "sup": "Nataly", "doc": "CHAVEZ PACHECO ANGELA KEILY", "cod": "02394.26.00008", "tipo": "Virtual", "sede": "ICA", "prog": "ESCUELA", "per": "2026-I", "curso": "DISEÑO ESTRATÉGICO DE MARCAS", "ciclo": "VI", "carrera": "DISEÑO Y GESTIÓN DE MARCAS - EEST", "mod": "VIRTUAL", "it": {"V1": 1, "V2": 1, "V3": 1, "V4": 1, "V5": 1, "V6": 0, "V7": 1, "V8": 1, "V9": 1, "V10": 1, "V11": 1}, "c": 10, "n": 1, "t": 11, "s": 90.9091, "obs": "La sesión del 15/05/2026 evaluación continua 1 del curso VI.01.2026-I Diseño Estratégico de Marcas – Diseño y Gestión de Marcas - EEST Virtual, se desarrolló mediante la exposición de trabajos por parte de los alumnos, promoviendo la participación y retroalimentación durante la clase.\n\nCabe precisar que, al tratarse de una sesión de exposiciones, no se realizó la presentación de PPT. La docente mostró apertura y disposición con respecto a la recomendación brindada sobre el uso del fondo.", "hal": "Inicia puntualmente su sesión, configura correctamente su Teams y brinda retroalimentación constante a los alumnos para fortalecer su aprendizaje. Asimismo, presenta buena entonación de voz, adecuado manejo del grupo y mantiene su cámara encendida durante toda la sesión. Al finalizar, vuelve a tomar asistencia y aclara el proceso de justificación de ausencia de los alumnos para el correcto registro de asistencia.", "opm": "Usar el fondo institucional de ZEGEL en pantalla, ya que fortalece la identidad visual. Asimismo, se pudo observar que, en una sesión anterior, sí utilizó el PPT de acuerdo con la línea gráfica institucional.", "com": "se va considerar la recomendación , si habría alguna que ustedes cuenten podrían proporcionarme se los agradecería mucho", "tm": ["Plantilla / identidad institucional", "Participación e interacción", "Metodología y estrategias"], "sinOpm": 0}, {"ts": "2026-05-28", "ym": "2026-05", "hh": 17, "marca": "Zegel", "sup": "Nataly", "doc": "TOKUMINE PALOMINO TETSU JULIANA", "cod": "3C003-DGM.26.00014", "tipo": "Presencial", "sede": "ICA", "prog": "ESCUELA", "per": "2026-I", "curso": "IDENTIDAD CORPORATIVA", "ciclo": "III", "carrera": "DISEÑO Y GESTIÓN DE MARCAS - EEST", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 0}, "c": 6, "n": 1, "t": 7, "s": 85.7143, "obs": "En la sesión del 18 de mayo del curso DISEÑO Y GESTIÓN DE MARCAS - EEST / III.01.2026-I IDENTIDAD CORPORATIVA, a cargo de la docente TOKUMINE PALOMINO TETSU JULIANA, realizada el lunes de 07:00 a 09:15, la docente inicia puntualmente la clase, toma asistencia al inicio y desarrolla la actividad de benchmarking, promoviendo constantemente la participación de los alumnos. Presenta buena entonación de voz, dinamismo durante la clase y realiza un breve resumen de las actividades trabajadas anteriormente para reforzar la parte aplicativa.\nLa docente utilizó una ruleta dinámica para seleccionar aleatoriamente a los grupos y revisar sus avances, brindando retroalimentación específica a cada grupo respecto a sus presentaciones, contenido y desarrollo visual del PPT.\nSe observó que la docente mantiene monitoreo constante, desplazándose entre los grupos para acompañar el desarrollo de las actividades y absolver consultas. \nRespecto al grupo de la alumna Sinche, inicialmente solo se encontraba presente un integrante; sin embargo, posteriormente se integraron las otras dos integrantes. La docente realizó seguimiento, acompañamiento y monitoreo constante al grupo además de aclarar lo que solicita y espera del grupo en cada sesión.\nFinalmente, conversó con el grupo y los alumnos quedaron conformes de acuerdo a las indicaciones brindadas.", "hal": "Puntualidad en el inicio de la sesión, toma de asistencia, dinámica durante la clase, dominio del tema, fluidez en el desarrollo, monitoreo constante a los grupos de trabajo y desplazamiento constante por el pasillo del aula para acompañar y orientar a los estudiantes. Asimismo, la docente es la última en retirarse del aula, evidenciando compromiso y acompañamiento durante toda la sesión.", "opm": "Se sugiere que, al iniciar la sesión, se presente el PPT con las indicaciones y pautas brindadas en la sesión anterior, así como las actividades y pautas de trabajo a desarrollar durante la clase. Asimismo, se recomienda apoyarse en la retroalimentación mediante Excel o Word, a fin de que las oportunidades de mejora y fortalezas brindadas durante la sesión queden registradas de manera clara y específica por grupo, permitiendo que todos los alumnos puedan revisarlas posteriormente.", "com": "La docente agradece las recomendaciones y las aplicará.", "tm": ["Plantilla / identidad institucional", "Registro de asistencia", "Puntualidad y manejo del tiempo", "Participación e interacción", "Metodología y estrategias"], "sinOpm": 0}, {"ts": "2026-05-29", "ym": "2026-05", "hh": 18, "marca": "Zegel", "sup": "Nataly", "doc": "HERRADA CORDOVA ANDREA DEL CARMEN", "cod": "02200.26.00017", "tipo": "Virtual", "sede": "ICA", "prog": "ESCUELA", "per": "2026-I", "curso": "COSTOS Y PRESUPUESTOS EN LA EMPRESA", "ciclo": "V", "carrera": "ADMINISTRACIÓN DE NEGOCIOS - EEST", "mod": "PRESENCIAL", "it": {"V1": 1, "V2": 1, "V3": 0, "V4": 1, "V5": 1, "V6": 1, "V7": 1, "V8": 1, "V9": 1, "V10": 1, "V11": 1}, "c": 10, "n": 1, "t": 11, "s": 90.9091, "obs": "En la sesión del 29 de mayo del curso Costos y Presupuestos para Administración, correspondiente a la sección V.02.2026-I, a cargo de la docente Herrada Córdova Andrea del Carmen, normalmente las clases se desarrollan de manera presencial; sin embargo, debido al mantenimiento de la sede, se realizó el acompañamiento en modalidad virtual en el horario de 11:00 a 13:15.\nLa docente se conectó e inició puntualmente la sesión. Configuró adecuada sposición para atender consultas e intervenciones del grupo.\nLos estudiantes participaron durante el desarrollo de la sesión.\nSe mantuvo un ambiente adecuado para el aprendizaje y el intercambio de ideas.\nEl desarrollo de la clase evidenció preparación y conocimiento de los temas abordados.", "opm": "Mantener la cámara encendida durante toda la sesión virtual, desde el inicio de la grabación hasta el cierre de la clase, de acuerdo con los lineamientos institucionales.\nReforzar la presencia docente en el entorno virtual mediante una interacción visual constante con los estudiantes.\nContinuar promoviendo la participación de los estudiantes y las buenas prácticas observadas durante la sesión.", "com": "El docente se compromete a mantener la cámara encendida durante toda la sesión virtual, desde el inicio de la grabación hasta el cierre de la clase, fortaleciendo su presencia docente y asegurando el cumplimiento de los lineamientos institucionales, sin dejar de promover la participación activa de los estudiantes.", "tm": ["Cámara y presencia visual", "Participación e interacción", "Cierre y síntesis de la clase", "Grabación y configuración de sala", "Permanencia y conectividad"], "sinOpm": 0}, {"ts": "2026-06-10", "ym": "2026-06", "hh": 15, "marca": "Zegel", "sup": "Lalita", "doc": "MESTANZA SUAREZ JHORDAN LEODAN", "cod": "02212.26.00022", "tipo": "Virtual", "sede": "CHICLAYO", "prog": "ESCUELA", "per": "2026-I", "curso": "GESTIÓN DE LA CADENA DE ABASTECIMIENTO", "ciclo": "VII", "carrera": "ADMINISTRACIÓN DE NEGOCIOS - EEST", "mod": "VIRTUAL", "it": {"V1": 0, "V2": 0, "V3": 0, "V4": 1, "V5": 1, "V6": 1, "V7": 1, "V8": 0, "V9": 1, "V10": 0, "V11": 0}, "c": 5, "n": 6, "t": 11, "s": 45.4545, "obs": "Monitoreo del cumplimiento de sus sesiones y aplicar la metodología de la institución.", "hal": "- Utiliza material institucional para el desarrollo de la sesión.\n- Presenta el objetivo de aprendizaje al inicio de la clase.", "opm": "- Fortalecer la puntualidad en el inicio de las sesiones. Durante la observación se evidenció que la clase inició aproximadamente nueve minutos después del horario programado.\n- Utilizar el fondo institucional durante el desarrollo de las clases, conforme a los lineamientos establecidos para la modalidad virtual.\n- Iniciar la grabación de la sesión desde el comienzo de la clase, garantizando que los estudiantes tengan acceso a la totalidad de los contenidos desarrollados.\n- Brindar instrucciones más precisas respecto a las actividades y evaluaciones, ya que durante la sesión algunos estudiantes manifestaron dudas sobre el espacio o procedimiento para la entrega de sus evidencias.\n- Mantener una comunicación alineada con la planificación académica del curso. Se observó que algunos estudiantes presentaban dudas respecto a la secuencia de contenidos y las respuestas brindadas podrían generar confusión sobre la estructura y organización de la asignatura.\n- Gestionar adecuadamente los tiempos de las actividades propuestas, asegurando que las dinámicas grupales contemplen espacios para la socialización de resultados, exposiciones y retroalimentación.\n- Incorporar un cierre pedagógico al finalizar cada sesión, reforzando los principales aprendizajes alcanzados, resolviendo dudas finales y vinculando los contenidos trabajados con las siguientes sesiones.", "com": "Docente manifiesta su disposición para fortalecer la gestión de sus sesiones, asegurando el cumplimiento de los lineamientos institucionales relacionados con la puntualidad, el uso de recursos institucionales, la comunicación académica y el adecuado cierre de las actividades de aprendizaje.", "tm": ["Plantilla / identidad institucional", "Puntualidad y manejo del tiempo", "Participación e interacción", "Metodología y estrategias", "Cierre y síntesis de la clase", "Grabación y configuración de sala"], "sinOpm": 0}, {"ts": "2026-06-10", "ym": "2026-06", "hh": 19, "marca": "Idat", "sup": "Eduardo", "doc": "CABRERA CONTRERAS NILTON CESAR", "cod": "1124.26.00007", "tipo": "Presencial", "sede": "WILSON", "prog": "CCM", "per": "2026-II", "curso": "SISTEMAS NEUMÁTICOS E HIDRÁULICOS", "ciclo": "V", "carrera": "ELECTRICIDAD INDUSTRIAL", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 1}, "c": 7, "n": 0, "t": 7, "s": 100.0, "obs": "Docente promueve un buen ambiente de estudio dentro del taller donde se desarrolla la clase.", "hal": "Responde todas las consultas de los alumnos y los hace participar dentro de la clase.", "opm": "Usar los equipamientos de protección EPP's dentro del aula. Ni el docente ni los alumnos utilizan dicho equipamientos dentro del taller.", "com": "Usar los EPP's por su seguridad y la de sus estudiantes respetando los protocolos de seguridad de la sede.", "tm": [], "sinOpm": 0}, {"ts": "2026-06-11", "ym": "2026-06", "hh": 11, "marca": "Zegel", "sup": "Olga", "doc": "RUIZ MONDRAGON CARMEN ESTHER", "cod": "3C002-AN.26.00001", "tipo": "Presencial", "sede": "PIURA", "prog": "ESCUELA", "per": "2026-I", "curso": "ECONOMÍA APLICADA A LOS NEGOCIOS", "ciclo": "III", "carrera": "ADMINISTRACIÓN DE NEGOCIOS - EEST", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 1}, "c": 7, "n": 0, "t": 7, "s": 100.0, "obs": "Durante la visita presencial se evidenció una sesión dinámica y participativa, en la que la docente logró captar y mantener la atención de los estudiantes mediante una comunicación expresiva y cercana. Se observó un acompañamiento constante a los diferentes grupos de trabajo, promoviendo la interacción y el involucramiento de los estudiantes en las actividades propuestas. Asimismo, las explicaciones y ejemplos brindados estuvieron alineados al nivel de avance de los estudiantes, facilitando la comprensión de los contenidos desarrollados.", "hal": "Utilizó adecuadamente la modulación de la voz para captar la atención y mantener el interés de los estudiantes.\nRealizó un acompañamiento cercano a los grupos de trabajo, brindando orientación oportuna durante las actividades.\nGeneró espacios de participación e intercambio de ideas de manera natural.\nAdaptó sus explicaciones y ejemplos al nivel de comprensión y avance de los estudiantes.\nMantuvo a los estudiantes enfocados en los objetivos de la sesión.\nPropició un ambiente de confianza y participación activa durante toda la clase.", "opm": "Continuar fortaleciendo las estrategias de acompañamiento y participación que favorecen el involucramiento de los estudiantes.\nMantener el uso de ejemplos contextualizados que faciliten la comprensión de los contenidos.\nSeguir promoviendo espacios de aprendizaje colaborativo que permitan aprovechar las experiencias y aportes de los estudiantes.", "com": "La docente manifiesta su compromiso de continuar fortaleciendo las estrategias que promueven la participación, el acompañamiento cercano y la comprensión de los contenidos, manteniendo un ambiente de aprendizaje dinámico y centrado en las necesidades de los estudiantes.", "tm": ["Participación e interacción", "Metodología y estrategias"], "sinOpm": 0}, {"ts": "2026-06-11", "ym": "2026-06", "hh": 12, "marca": "Idat", "sup": "Eduardo", "doc": "TORRES REYES JOAO BAPTISTA", "cod": "03517.26.00001", "tipo": "Presencial", "sede": "SAN JUAN DE MIRAFLORES", "prog": "CCM", "per": "2026-II", "curso": "PROYECTO DE MECATRÓNICA AUTOMOTRIZ 1", "ciclo": "IV", "carrera": "MECATRÓNICA AUTOMOTRIZ", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 1}, "c": 7, "n": 0, "t": 7, "s": 100.0, "obs": "El docente no usa ppts porque es un curso de proyectos, en el curso se utilizan las fichas y las guías oficiales. El docente si utiliza dichos documentos.", "hal": "El docente cumple con el código de vestimenta IN.", "opm": "Regular su vocabulario frente a los alumnos.", "com": "Trabajar en el uso adecuado de las palabras al dirigirse al alumnado.", "tm": ["Plantilla / identidad institucional"], "sinOpm": 0}, {"ts": "2026-06-11", "ym": "2026-06", "hh": 13, "marca": "Zegel", "sup": "Olga", "doc": "RODRIGUEZ ACOSTA RAMSEY GIANCARLO", "cod": "1C004-PRH.26.00033", "tipo": "Presencial", "sede": "PIURA", "prog": "ESCUELA", "per": "2026-IIA", "curso": "DISEÑO ORGANIZACIONAL", "ciclo": "I", "carrera": "PLANIFICACIÓN DE PROCESOS ESTRATÉGICOS DE RECURSOS HUMANOS - EEST", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 1}, "c": 7, "n": 0, "t": 7, "s": 100.0, "obs": "Durante la visita se observó una comunicación cercana y respetuosa entre el docente y los estudiantes, promoviendo un ambiente de confianza que favoreció la participación y resolución de consultas. Asimismo, el docente desarrolló el tema programado conforme al sílabo y brindó orientaciones claras sobre el sistema de evaluación y las pautas del curso.", "hal": "Establece una comunicación efectiva que facilita la participación espontánea de los estudiantes.\nGenera un ambiente de confianza que favorece la resolución de dudas durante la sesión.\nComunica de manera clara los objetivos de la clase y las pautas académicas del curso.\nMantiene una actitud accesible y respetuosa durante toda la interacción con los estudiantes.\nRefuerza oportunamente aspectos relacionados con la evaluación y el seguimiento académico.", "opm": "Continuar incorporando estrategias que permitan identificar de manera oportuna el nivel de comprensión de todos los estudiantes, fortaleciendo así el seguimiento del aprendizaje durante la sesión.", "com": "Seguir fortaleciendo los espacios de interacción y consulta con los estudiantes. Mantener la comunicación clara de los criterios académicos y de evaluación.", "tm": ["Participación e interacción", "Metodología y estrategias"], "sinOpm": 0}, {"ts": "2026-06-11", "ym": "2026-06", "hh": 13, "marca": "Zegel", "sup": "Olga", "doc": "QUINTANILLA BAIOCCHI DIEGO ARTURO", "cod": "02626.26.00109", "tipo": "Virtual", "sede": "PIURA", "prog": "ESCUELA", "per": "2026-I", "curso": "PROYECTO DE INNOVACI 1}, "c": 11, "n": 0, "t": 11, "s": 100.0, "obs": "Observar los comentarios de los estudiantes en cuanto metodología", "hal": "- Inicia la sesión de manera puntual.\n- Mantiene la cámara encendida durante el desarrollo de la clase.\n- Al inicio de la sesión, retoma los contenidos trabajados en la clase anterior y presenta los temas que se abordarán en la siguiente sesión.", "opm": "- Al presentar el logro de la sesión, se recomienda no solo mencionarlo, sino también explicarlo y contextualizarlo, de manera que los estudiantes comprendan qué se espera que logren al finalizar la clase y cómo las actividades contribuirán a alcanzarlo.\n\n- Durante el desarrollo del trabajo grupal, sería importante explicitar con mayor claridad la dinámica de la actividad. Por ejemplo, asegurar que todos los estudiantes conozcan el material o caso asignado a cada grupo y establecer espacios donde puedan conocer el trabajo de sus compañeros. Asimismo, se recomienda brindar retroalimentación durante el proceso, permitiendo que los grupos identifiquen oportunidades de mejora e incorporen las observaciones realizadas antes de la siguiente sesión.\n\n- Promover una mayor participación durante la clase mediante preguntas, análisis de casos o espacios de discusión que involucren activamente a los estudiantes y mantengan su atención a lo largo de la sesión.\n\n- Considerar la realización de críticas o comentarios colectivos sobre los trabajos presentados durante la misma clase. Esto permitirá que todos los estudiantes conozcan diferentes enfoques, aporten sugerencias y enriquezcan su aprendizaje a partir de las producciones de sus compañeros.\n\n- Al finalizar la sesión, incorporar un cierre que permita consolidar los aprendizajes alcanzados. Se recomienda destinar unos minutos para realizar una síntesis de los principales contenidos trabajados o formular preguntas como: ¿Qué aprendimos hoy? o ¿Qué aspectos consideran más importantes de la sesión?\n\n- Durante la presentación del contenido, procurar avanzar por las diapositivas con un ritmo que permita a los estudiantes procesar la información, formular preguntas y resolver dudas antes de continuar con el siguiente tema. Generar estos espacios favorecerá una mayor interacción y participación durante la clase.", "com": "Explicar el logro de la sesión, fortalecer la retroalimentación durante los trabajos grupales, implementar estrategias que promuevan una mayor participación de los estudiantes e incorporar un cierre que consolide los aprendizajes de cada clase.", "tm": ["Plantilla / identidad institucional", "Participación e interacción", "Metodología y estrategias", "Cierre y síntesis de la clase", "Recursos y equipos del aula"], "sinOpm": 0}, {"ts": "2026-07-01", "ym": "2026-07", "hh": 9, "marca": "Idat", "sup": "Milagros", "doc": "ALIAGA YUPANQUI CHRISTIAN ADOLFO", "cod": "1C002-ARC.26.00005", "tipo": "Presencial", "sede": "PETIT THOUARS", "prog": "ESCUELA", "per": "2026-IIA", "curso": "FUNDAMENTO DE REDES", "ciclo": "I", "carrera": "ADMINISTRACIÓN DE CIBERSEGURIDAD - EEST", "mod": "PRESENCIAL", "it": {"P1": 1, "P2": 1, "P3": 1, "P4": 1, "P5": 1, "P6": 1, "P7": 1}, "c": 7, "n": 0, "t": 7, "s": 100.0, "obs": "Ninguna", "hal": "El docente realiza una práctica con los alumnos sobre la identificación y prueba de los puertos y del switch, explicando las diferencias entre los dispositivos y sus funciones. Y durante la actividad práctica los estudiantes participan de manera activa.", "opm": "Seguir reforzando con los alumnos la participación voluntaria de todos los alumnos, sin depender de incentivos como puntos adicionales. Se observó que algunos estudiantes buscan este tipo de incentivos para participar en clase.", "com": "Docente se compromete a seguir implementando estrategias que motiven a los estudiantes en su participación en clase.", "tm": ["Participación e interacción"], "sinOpm": 0}, {"ts": "2026-07-01", "ym": "2026-07", "hh": 16, "marca": "Idat", "sup": "Lalita", "doc": "MELENDEZ MELENDEZ FERNANDO", "     for(i=0;i<CRIT.length;i++){ if(CRIT[i].dim!==DIMS[k]) continue;
      for(j=0;j<rows.length;j++){ var v=rows[j].it[CRIT[i].code]; if(v===1)cu++; else if(v===0)nc++; } }
    if(cu+nc>0) out.push({dim:DIMS[k],cumple:cu,nocumple:nc,tot:cu+nc,pct:cu/(cu+nc)*100});
  }
  return out;
}
function temaStats(rows){
  var m={},i,j;
  for(i=0;i<META.temas.length;i++) m[META.temas[i]]={n:0,marca:{}};
  for(i=0;i<rows.length;i++){ for(j=0;j<rows[i].tm.length;j++){ var t=rows[i].tm[j];
      if(!m[t]) m[t]={n:0,marca:{}}; m[t].n++; m[t].marca[rows[i].marca]=(m[t].marca[rows[i].marca]||0)+1; } }
  var o=[],k; for(k in m){ if(m.hasOwnProperty(k) && m[k].n>0) o.push({tema:k,n:m[k].n,marca:m[k].marca}); }
  o.sort(function(a,b){return b.n-a.n;});
  return o;
}
function monthly(rows){
  var g=groupStats(rows,function(r){return r.ym;});
  g.sort(function(a,b){return a.key<b.key?-1:1;});
  return g;
}
function heat(p){ /* color scale 60->100 */
  if(p===null||isNaN(p)) return {bg:'#F1F4F8',fg:'#95A0AE'};
  var s=sem(p);
  var a = p>=100?0.22:(p>=85?0.20:(p>=70?0.24:0.26));
  return {bg:hexa(s.col,a), fg:'#22303F'};
}
function hexa(h,a){ var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')'; }
function bcol(m){ return BRAND[m] || '#5B7A9B'; }

/* ---- chart registry ---- */
var CH={};
function chart(id, cfg){
  var el=document.getElementById(id); if(!el) return;
  if(CH[id]){ CH[id].destroy(); }
  CH[id]=new Chart(el.getContext('2d'), cfg);
}
function noData(id){ var el=document.getElementById(id); if(el&&el.parentNode) el.parentNode.innerHTML='<div class="empty">Sin datos para los filtros aplicados.</div>'; }
</script>

<script>
/* ============ SHELL ============ */
var CUR='p1';
(function init(){
  var nav=document.getElementById('nav'), pg=document.getElementById('pages'), h='',ph='',i;
  for(i=0;i<PAGES.length;i++){ h+='<a data-p="'+PAGES[i].id+'" class="'+(i===0?'on':'')+'"><span class="nu">'+PAGES[i].nu+'</span><span>'+PAGES[i].name+'</span></a>';
    ph+='<div class="page'+(i===0?' on':'')+'" id="'+PAGES[i].id+'">'+PAGEHTML[PAGES[i].id]+'</div>'; }
  nav.innerHTML=h; pg.innerHTML=ph;
  nav.onclick=function(e){ var a=e.target.closest?e.target.closest('a'):null; if(!a) return; go(a.getAttribute('data-p')); };
  document.getElementById('btnClear').onclick=function(){ var k; for(k in STATE) STATE[k]=''; buildFilters(); render(); };
  document.getElementById('btnReload').onclick=function(){ reloadSheet(); };
  document.getElementById('footRows').innerHTML=RAW.length+' visitas · datos al '+META.generado;
  setTimeout(function(){ buildFilters(); render(); },0);
})();
function go(id){
  CUR=id; var i,a=document.querySelectorAll('#nav a'), p=document.querySelectorAll('.page');
  for(i=0;i<a.length;i++) a[i].className = a[i].getAttribute('data-p')===id?'on':'';
  for(i=0;i<p.length;i++) p[i].className = 'page'+(p[i].id===id?' on':'');
  for(i=0;i<PAGES.length;i++) if(PAGES[i].id===id){ document.getElementById('pgTitle').textContent=PAGES[i].name; document.getElementById('pgSub').textContent=PAGES[i].sub; }
  render();
}
/* ---- filters ---- */
function buildFilters(){
  var el=document.getElementById('filters'), h='',i,j;
  for(i=0;i<FDEF.length;i++){
    var f=FDEF[i], rows=view(f.k), vals=[],m={};
    for(j=0;j<rows.length;j++){ var v=rows[j][f.f]; if(v&&!m[v]){m[v]=1;vals.push(v);} }
    vals.sort();
    if(STATE[f.k] && vals.indexOf(STATE[f.k])<0) vals.push(STATE[f.k]);
    h+='<div class="f"><label>'+f.lb+'</label><select data-k="'+f.k+'"><option value="">Todas</option>';
    for(j=0;j<vals.length;j++) h+='<option value="'+esc(vals[j])+'"'+(STATE[f.k]===vals[j]?' selected':'')+'>'+esc(vals[j])+'</option>';
    h+='</select></div>';
  }
  h+='<div class="f"><label>Docente</label><input data-k="doc" value="'+esc(STATE.doc)+'" placeholder="Apellido…"></div>';
  h+='<div class="f"><label>Curso / carrera</label><input data-k="curso" value="'+esc(STATE.curso)+'" placeholder="Texto…"></div>';
  h+='<div class="f"><label>Desde</label><input type="date" data-k="desde" value="'+STATE.desde+'"></div>';
  h+='<div class="f"><label>Hasta</label><input type="date" data-k="hasta" value="'+STATE.hasta+'"></div>';
  el.innerHTML=h;
  var sels=el.querySelectorAll('select,input');
  for(i=0;i<sels.length;i++){
    sels[i].onchange=function(){ STATE[this.getAttribute('data-k')]=this.value; buildFilters(); render(); };
    if(sels[i].tagName==='INPUT' && sels[i].type!=='date'){
      sels[i].onkeyup=function(e){ if(e.keyCode===13){ STATE[this.getAttribute('data-k')]=this.value; buildFilters(); render(); } };
    }
  }
  drawChips();
}
function drawChips(){
  var c=document.getElementById('chips'), h='',i;
  var lbl={doc:'Docente',curso:'Curso',desde:'Desde',hasta:'Hasta'};
  for(i=0;i<FDEF.length;i++) if(STATE[FDEF[i].k]) h+='<span class="chip"><b>'+FDEF[i].lb+':</b> '+esc(STATE[FDEF[i].k])+' <i data-k="'+FDEF[i].k+'">✕</i></span>';
  var k; for(k in lbl) if(STATE[k]) h+='<span class="chip"><b>'+lbl[k]+':</b> '+esc(STATE[k])+' <i data-k="'+k+'">✕</i></span>';
  c.innerHTML=h;
  var xs=c.querySelectorAll('i');
  for(i=0;i<xs.length;i++) xs[i].onclick=function(){ STATE[this.getAttribute('data-k')]=''; buildFilters(); render(); };
}
function setF(k,v){ STATE[k]= (STATE[k]===v?'':v); buildFilters(); render(); }

/* ---- tables ---- */
function tbl(cols, rows, opt){
  opt=opt||{};
  var h='<div class="scroll'+(opt.h300?' h300':'')+'"><table class="t"><thead><tr>',i,j;
  for(i=0;i<cols.length;i++) h+='<th class="'+(cols[i].num?'num':'')+'">'+cols[i].t+'</th>';
  h+='</tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="'+cols.length+'"><div class="empty">Sin datos para los filtros aplicados.</div></td></tr>';
  for(i=0;i<rows.length;i++){ h+='<tr>'; for(j=0;j<cols.length;j++) h+='<td class="'+(cols[j].num?'num mono':'')+'">'+rows[i][j]+'</td>'; h+='</tr>'; }
  return h+'</tbody></table></div>';
}
function barCell(p){ var s=sem(p); return '<div style="display:flex;gap:7px;align-items:center;justify-content:flex-end"><span class="mono">'+pct(p)+'</span><span class="bar" style="width:70px"><i style="width:'+Math.max(2,p)+'%;background:'+s.col+'"></i></span></div>'; }
function semTag(p){ var s=sem(p); return '<span class="tag '+s.cls+'">'+s.name+'</span>'; }

/* ---- KPI ---- */
function kpi(el, arr){
  var h='',i; for(i=0;i<arr.length;i++){ var a=arr[i];
    h+='<div class="kpi '+(a.c||'')+'"><div class="k">'+a.k+'</div><div class="v mono">'+a.v+'</div><div class="d">'+(a.d||'')+'</div></div>'; }
  document.getElementById(el).innerHTML=h;
}
function heatTable(rowsLbl, colsLbl, matrix, elId, colWidthRot){
  var h='<table class="hm"><thead><tr><th></th>',i,j;
  for(j=0;j<colsLbl.length;j++) h+='<th class="'+(colWidthRot?'rot':'')+'">'+esc(colsLbl[j])+'</th>';
  h+='</tr></thead><tbody>';
  for(i=0;i<rowsLbl.length;i++){ h+='<tr><th>'+esc(rowsLbl[i])+'</th>';
    for(j=0;j<colsLbl.length;j++){ var v=matrix[i][j]; if(v===null||v===undefined){ h+='<td style="background:#F7F9FB;color:#C7CFDA">—</td>'; }
      else { var c=heat(v); h+='<td style="background:'+c.bg+';color:'+c.fg+'">'+v.toFixed(0)+'</td>'; } }
    h+='</tr>'; }
  document.getElementById(elId).innerHTML=h+'</tbody></table>';
}
</script>
<script>
/* ============ RENDER ============ */
function render(){
  var rows=view(null);
  if(CUR==='p1') pg1(rows); if(CUR==='p2') pg2(rows); if(CUR==='p3') pg3(rows);
  if(CUR==='p4') pg4(rows); if(CUR==='p5') pg5(rows); if(CUR==='p6') pg6(rows); if(CUR==='p7') pg7(rows);
}
var GRID={grid:{color:'#EEF1F5'},border:{display:false},ticks:{font:{size:10}}};
var GRIDX={grid:{display:false},border:{display:false},ticks:{font:{size:10}}};

/* ---------- P1 ---------- */
function pg1(rows){
  var a=agg(rows), all=agg(RAW);
  kpi('k1',[
   {k:'Visitas realizadas', v:num(a.n_ev), d:a.n_ev===RAW.length?'Total del periodo':(pct(a.n_ev/RAW.length*100,0)+' del total registrado')},
   {k:'Cumplimiento ponderado', v:pct(a.pct), d:num(a.cumple)+' de '+num(a.items)+' ítems', c:sem(a.pct).k==='exc'?'g':(sem(a.pct).k==='bue'?'y':(sem(a.pct).k==='seg'?'o':'r'))},
   {k:'Incumplimiento', v:pct(a.items?a.nocumple/a.items*100:0), d:num(a.nocumple)+' ítems observados', c:'r'},
   {k:'Visitas sin observación', v:num(a.perf), d:pct(a.n_ev?a.perf/a.n_ev*100:0)+' con cumplimiento total', c:'g'},
   {k:'Docentes evaluados', v:num(a.docs), d:'Registros únicos por nombre'},
   {k:'Sedes cubiertas', v:num(a.sedes), d:num(a.marcas)+' marcas · '+num(a.sups)+' supervisores'},
   {k:'Oportunidades de mejora', v:num(a.opor), d:'Visitas con recomendación registrada'},
   {k:'Compromisos docentes', v:num(a.comp), d:pct(a.opor?a.comp/a.opor*100:0)+' de las oportunidades'}
  ]);
  if(!rows.length){ return; }
  /* gauge */
  var s=sem(a.pct);
  chart('c_gauge',{type:'doughnut',data:{labels:['Cumple','No cumple'],datasets:[{data:[a.cumple,a.nocumple],backgroundColor:[s.col,'#EDF1F6'],borderWidth:0,cutout:'76%',circumference:180,rotation:270}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.label+': '+num(c.raw)+' ítems';}}}}}});
  document.getElementById('gaugeTxt').innerHTML='<div class="mono" style="font-size:34px;font-weight:600;color:'+s.col+'">'+pct(a.pct)+'</div><div style="font-size:11px;color:var(--muted)">'+s.name+' · meta 95%</div>';
  /* semaforo */
  var buckets=[0,0,0,0],i;
  for(i=0;i<rows.length;i++){ var k=sem(rows[i].s).k; buckets[k==='exc'?0:k==='bue'?1:k==='seg'?2:3]++; }
  chart('c_semaforo',{type:'doughnut',data:{labels:['Excelente (100%)','Bueno (85–99%)','En seguimiento (70–84%)','Crítico (<70%)'],
    datasets:[{data:buckets,backgroundColor:[SEM[0].col,SEM[1].col,SEM[2].col,SEM[3].col],borderWidth:2,borderColor:'#fff',cutout:'58%'}]},
    options:{plugins:{legend:{position:'right',labels:{boxWidth:9,boxHeight:9,font:{size:10.5},padding:8}},
      datalabels:{display:function(c){return c.dataset.data[c.dataIndex]>0;},color:'#fff',font:{weight:'600',size:11},formatter:function(v){return v;}}}}});
  /* marca */
  var gm=groupStats(rows,function(r){return r.marca;}); gm.sort(function(x,y){return y.pct-x.pct;});
  chart('c_marca1',{type:'bar',data:{labels:gm.map(function(g){return g.key;}),datasets:[{data:gm.map(function(g){return g.pct;}),backgroundColor:gm.map(function(g){return bcol(g.key);}),borderRadius:4,barPercentage:.62}]},
    options:{scales:{y:{min:60,max:100,grid:GRID.grid,border:{display:false},ticks:{callback:function(v){return v+'%';},font:{size:10}}},x:GRIDX},
      plugins:{legend:{display:false},datalabels:{display:true,anchor:'end',align:'top',offset:-2,color:'#0E1726',font:{weight:'600',size:11},formatter:function(v){return v.toFixed(1)+'%';}},
        tooltip:{callbacks:{afterLabel:function(c){var g=gm[c.dataIndex];return num(g.n_ev)+' visitas · '+num(g.docs)+' docentes';}}}},
      onClick:function(e,el){ if(el.length) setF('marca',gm[el[0].index].key); }}});
  /* trend */
  var mt=monthly(rows);
  chart('c_trend',{data:{labels:mt.map(function(g){return g.key;}),datasets:[
      {type:'bar',label:'Visitas',data:mt.map(function(g){return g.n_ev;}),backgroundColor:'#DCE5F1',borderRadius:4,yAxisID:'y1',order:2,barPercentage:.55},
      {type:'line',label:'% cumplimiento',data:mt.map(function(g){return g.pct;}),borderColor:'#1E63C8',backgroundColor:'#1E63C8',tension:.3,pointRadius:4,pointHoverRadius:6,borderWidth:2.5,yAxisID:'y',order:1}]},
    options:{scales:{y:{min:70,max:100,position:'left',grid:GRID.grid,border:{display:false},ticks:{callback:function(v){return v+'%';},font:{size:10}}},
      y1:{position:'right',grid:{display:false},border:{display:false},ticks:{font:{size:10}}},x:GRIDX},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}},
        datalabels:{display:function(c){return c.dataset.type==='line';},align:'top',offset:6,color:'#1E63C8',font:{weight:'600',size:10},formatter:function(v){return v.toFixed(1);}}}}});
  /* radar */
  var ds=dimStats(rows);
  chart('c_radar1',{type:'radar',data:{labels:ds.map(function(d){return d.dim;}),datasets:[{label:'% cumplimiento',data:ds.map(function(d){return d.pct;}),
      borderColor:'#1E63C8',backgroundColor:'rgba(30,99,200,.14)',pointBackgroundColor:'#1E63C8',borderWidth:2,pointRadius:3}]},
    options:{scales:{r:{min:50,max:100,ticks:{stepSize:10,font:{size:9},backdropColor:'transparent'},pointLabels:{font:{size:10}},grid:{color:'#E8EDF4'},angleLines:{color:'#E8EDF4'}}},plugins:{legend:{display:false}}}});
  /* fort / brecha */
  var cs=critStats(rows).filter(function(c){return c.tot>=20;});
  cs.sort(function(x,y){return y.pct-x.pct;});
  var cols=[{t:'Criterio'},{t:'Ficha'},{t:'Ítems',num:1},{t:'Cumplimiento',num:1}];
  function fila(c){ return [esc(c.label)+'<div style="font-size:10px;color:var(--muted)">'+esc(c.dim)+'</div>', c.mod, num(c.tot), barCell(c.pct)]; }
  document.getElementById('tblFort').innerHTML=tbl(cols, cs.slice(0,6).map(fila),{h300:1});
  var bad=cs.slice().reverse().slice(0,6);
  document.getElementById('tblBrecha').innerHTML=tbl([{t:'Criterio'},{t:'Ficha'},{t:'Brecha',num:1},{t:'Cumplimiento',num:1}],
    bad.map(function(c){return [esc(c.label)+'<div style="font-size:10px;color:var(--muted)">'+esc(c.dim)+'</div>', c.mod, '<b style="color:'+SEM[3].col+'">'+c.nocumple+'</b> de '+c.tot, barCell(c.pct)];}),{h300:1});
  insights(rows,a,gm,cs);
  recos(rows,a,cs);
  riesgos(rows,a);
}
</script>
<script>
/* ---------- INSIGHTS / RECOS / RIESGOS ---------- */
function ins(cls,lb,tx,ev){ return '<div class="i '+cls+'"><div class="lb">'+lb+'</div><div class="tx">'+tx+'</div>'+(ev?'<div class="ev">Evidencia: '+ev+'</div>':'')+'</div>'; }
function insights(rows,a,gm,cs){
  var h='',i;
  var gs=groupStats(rows,function(r){return r.marca+' · '+r.sede;}).filter(function(g){return g.n_ev>=8;});
  gs.sort(function(x,y){return x.pct-y.pct;});
  var gt=groupStats(rows,function(r){return r.tipo;});
  var mt=monthly(rows);
  var best=cs.length?cs[0]:null, worst=cs.length?cs[cs.length-1]:null;
  var tem=temaStats(rows);
  var gmS=gm.slice().sort(function(x,y){return y.pct-x.pct;});
  /* fortaleza */
  if(best) h+=ins('pos','Principal fortaleza','<b>'+esc(best.label)+'</b> es el criterio más consolidado de la ficha '+best.mod.toLowerCase()+'.', pct(best.pct)+' de cumplimiento sobre '+num(best.tot)+' ítems evaluados.');
  if(worst) h+=ins('neg','Principal debilidad','<b>'+esc(worst.label)+'</b> concentra la mayor brecha de todo el instrumento.', num(worst.nocumple)+' incumplimientos de '+num(worst.tot)+' ítems ('+pct(100-worst.pct)+' de brecha).');
  /* marcas */
  if(gmS.length>1){
    h+=ins('pos','Marca con mejor desempeño','<b>'+esc(gmS[0].key)+'</b> lidera el cumplimiento ponderado con '+pct(gmS[0].pct)+'.', num(gmS[0].n_ev)+' visitas · '+num(gmS[0].docs)+' docentes · '+num(gmS[0].sedes)+' sedes.');
    var lo=gmS[gmS.length-1];
    h+=ins('warn','Marca con mayor oportunidad','<b>'+esc(lo.key)+'</b> registra el cumplimiento más bajo ('+pct(lo.pct)+'), a '+(gmS[0].pct-lo.pct).toFixed(1)+' puntos de la marca líder.', num(lo.nocumple)+' incumplimientos sobre '+num(lo.items)+' ítems.');
  }
  /* sede riesgo */
  if(gs.length){ var sr=gs[0];
    h+=ins('neg','Sede con mayor riesgo','<b>'+esc(sr.key)+'</b> presenta el cumplimiento más bajo entre las sedes con evidencia suficiente (8+ visitas).', pct(sr.pct)+' de cumplimiento · '+num(sr.nocumple)+' incumplimientos en '+num(sr.n_ev)+' visitas.');
  }
  /* modalidad */
  if(gt.length===2){
    var v=gt[0].key==='Virtual'?gt[0]:gt[1], p=gt[0].key==='Presencial'?gt[0]:gt[1];
    if(p.pct-v.pct>2) h+=ins('warn','Brecha estructural por modalidad','La clase virtual cumple '+(p.pct-v.pct).toFixed(1)+' puntos menos que la presencial. La brecha del sistema es principalmente virtual, no institucional.', 'Presencial '+pct(p.pct)+' ('+num(p.n_ev)+' visitas) vs. virtual '+pct(v.pct)+' ('+num(v.n_ev)+' visitas).');
  }
  /* tendencia */
  if(mt.length>=3){
    var f=mt[0], l=mt[mt.length-1], d=l.pct-f.pct;
    var lastN = mt.slice(-3), slope = lastN[2].pct-lastN[0].pct;
    h+=ins(slope>=0?'pos':'neg', slope>=0?'Tendencia positiva':'Tendencia negativa',
      'Los últimos tres meses ('+lastN[0].key+' → '+lastN[2].key+') muestran una variación de <b>'+(slope>=0?'+':'')+slope.toFixed(1)+' puntos</b> en el cumplimiento ponderado.',
      lastN.map(function(m){return m.key+': '+pct(m.pct)+' ('+m.n_ev+' visitas)';}).join(' · '));
    h+=ins(d>=0?'pos':'warn','Variación del periodo completo','Entre '+f.key+' y '+l.key+' el cumplimiento pasó de '+pct(f.pct)+' a '+pct(l.pct)+' ('+(d>=0?'+':'')+d.toFixed(1)+' pts).', 'El último mes puede estar incompleto según la fecha de corte.');
  }
  /* hallazgo recurrente */
  if(tem.length){
    h+=ins('warn','Hallazgo recurrente','<b>'+esc(tem[0].tema)+'</b> es el tema que más aparece en las oportunidades de mejora y observaciones.', 'Presente en '+num(tem[0].n)+' visitas ('+pct(tem[0].n/rows.length*100)+' del total filtrado).');
    if(tem.length>2) h+=ins('','Oportunidad prioritaria','Los tres temas más frecuentes — '+esc(tem[0].tema)+', '+esc(tem[1].tema)+' y '+esc(tem[2].tema)+' — concentran la mayor parte del texto cualitativo y son abordables con una sola campaña de inducción.', 'Suman '+num(tem[0].n+tem[1].n+tem[2].n)+' menciones.');
  }
  /* concentracion supervision */
  var gsu=groupStats(rows,function(r){return r.sup;});
  if(gsu.length>2){ gsu.sort(function(x,y){return y.n_ev-x.n_ev;});
    var top3=gsu[0].n_ev+gsu[1].n_ev+gsu[2].n_ev;
    h+=ins('','Dónde concentrar la supervisión','Las sedes con menor cumplimiento y suficiente evidencia deben recibir la próxima ola de visitas; las sedes con menos de 8 visitas requieren cobertura antes de poder concluir sobre ellas.', 'Los 3 supervisores más activos realizan '+pct(top3/rows.length*100,0)+' de las visitas.');
  }
  document.getElementById('insights').innerHTML=h;
}
function recos(rows,a,cs){
  var alta='',media='',baja='',i;
  var bad=cs.slice().sort(function(x,y){return x.pct-y.pct;});
  var gt=groupStats(rows,function(r){return r.tipo;});
  var gs=groupStats(rows,function(r){return r.marca+' · '+r.sede;}).filter(function(g){return g.n_ev>=8;}).sort(function(x,y){return x.pct-y.pct;});
  var gsPoc=groupStats(rows,function(r){return r.marca+' · '+r.sede;}).filter(function(g){return g.n_ev<6;});
  var tem=temaStats(rows);
  function R(t,prob,ev,acc,ind){ return '<div class="r1"><b>'+t+'</b><span class="m">Problema:</span> '+prob+'<br><span class="m">Evidencia:</span> '+ev+'<br><span class="m">Acción:</span> '+acc+'<br><span class="m">Indicador de seguimiento:</span> '+ind+'</div>'; }
  for(i=0;i<Math.min(2,bad.length);i++){ var c=bad[i];
    alta+=R(c.label, 'Criterio con el incumplimiento más alto del instrumento.', num(c.nocumple)+' de '+num(c.tot)+' ítems incumplen ('+pct(100-c.pct)+' de brecha).',
      'Comunicado de lineamiento + verificación en las próximas visitas a los docentes ya observados en este criterio.',
      '% de cumplimiento del criterio ≥ 85% en el siguiente mes.'); }
  if(gt.length===2){ var v=gt[0].key==='Virtual'?gt[0]:gt[1], p=gt[0].key==='Presencial'?gt[0]:gt[1];
    if(p.pct-v.pct>2) alta+=R('Brecha de la clase virtual','La ficha virtual cumple sistemáticamente menos que la presencial.',
      'Virtual '+pct(v.pct)+' vs. presencial '+pct(p.pct)+' ('+(p.pct-v.pct).toFixed(1)+' pts de diferencia).',
      'Inducción obligatoria de sesión virtual (cámara, plantilla, grabación, asistencia) para todos los docentes con carga virtual.',
      'Reducir la brecha presencial–virtual a menos de 4 puntos.'); }
  if(gs.length) alta+=R('Sede '+gs[0].key,'Cumplimiento más bajo entre las sedes con evidencia suficiente.',
      pct(gs[0].pct)+' con '+num(gs[0].n_ev)+' visitas y '+num(gs[0].nocumple)+' incumplimientos.',
      'Plan de acompañamiento con el coordinador académico de la sede y doble frecuencia de visita por un mes.',
      'Cumplimiento de la sede ≥ promedio institucional en 60 días.');
  for(i=2;i<Math.min(5,bad.length);i++){ var c2=bad[i];
    media+=R(c2.label,'Criterio por debajo del estándar esperado.', num(c2.nocumple)+' incumplimientos de '+num(c2.tot)+' ítems ('+pct(c2.pct)+' de cumplimiento).',
      'Recordatorio en reunión de coordinadores y refuerzo en la retroalimentación post-visita.','Cumplimiento del criterio ≥ 90%.'); }
  if(tem.length) media+=R('Tema recurrente: '+tem[0].tema,'Aparece de forma repetida en el texto libre de las supervisiones.',
      'Mencionado en '+num(tem[0].n)+' visitas ('+pct(tem[0].n/rows.length*100)+').','Micro-cápsula formativa de 15 minutos sobre este tema en la inducción de inicio de ciclo.','Reducción de menciones del tema en el siguiente periodo.');
  if(gsPoc.length) media+=R('Cobertura desigual de sedes','Existen sedes con muy pocas visitas; sus indicadores no son concluyentes.',
      num(gsPoc.length)+' sedes con menos de 6 visitas en el periodo filtrado.','Redistribuir la programación para alcanzar un mínimo de 8 visitas por sede y ciclo.','Nº de sedes por debajo del mínimo = 0.');
  var sinOpm=0,sinCom=0; for(i=0;i<rows.length;i++){ if(rows[i].sinOpm) sinOpm++; if(!rows[i].com||rows[i].com==='-') sinCom++; }
  if(sinCom>0) baja+=R('Registro del compromiso docente','En parte de las visitas no queda registrado el compromiso asumido por el docente.',
      num(sinCom)+' de '+num(rows.length)+' visitas sin compromiso registrado.','Hacer obligatorio el campo en el formulario cuando exista al menos un ítem «No cumple».','100% de visitas con incumplimiento tienen compromiso registrado.');
  baja+=R('Estandarización del catálogo de sedes','Existen sedes con nomenclatura distinta entre marcas (con y sin prefijo «LIMA -»).',
      'Ej.: «SAN JUAN DE LURIGANCHO» y «LIMA - SAN JUAN DE LURIGANCHO» conviven en marcas distintas.','Publicar una lista desplegable cerrada de sedes por marca en el formulario.','0 valores de sede fuera del catálogo.');
  baja+=R('Automatizar el tablero','El análisis depende hoy de una descarga manual de la hoja de respuestas.','Fuente única: hoja «Respuestas de formulario 2».',
      'Conectar este tablero al Sheet publicado y programar refresco diario.','Tablero actualizado sin intervención manual.');
  var el=document.getElementById('recos');
  el.innerHTML='<div class="rec alta"><div class="rh">Alta prioridad · intervención inmediata</div><div class="rb">'+(alta||'<div class="r1">Sin brechas que requieran intervención inmediata en la selección actual.</div>')+'</div></div>'+
    '<div class="rec media"><div class="rh">Media prioridad · seguimiento</div><div class="rb">'+(media||'<div class="r1">—</div>')+'</div></div>'+
    '<div class="rec baja"><div class="rh">Baja prioridad · optimización</div><div class="rb">'+baja+'</div></div>';
}
function riesgos(rows,a){
  var i, h='';
  var gs=groupStats(rows,function(r){return r.marca+' · '+r.sede;});
  var pocas=gs.filter(function(g){return g.n_ev<6;}).sort(function(x,y){return x.n_ev-y.n_ev;});
  var docm={}, rec=[];
  for(i=0;i<rows.length;i++){ if(!docm[rows[i].doc]) docm[rows[i].doc]=[]; docm[rows[i].doc].push(rows[i]); }
  var k; for(k in docm){ if(docm[k].length>1) rec.push({doc:k,n:docm[k].length,rows:docm[k]}); }
  var sinOpm=0,sinObs=0,nohoras=0;
  for(i=0;i<rows.length;i++){ if(rows[i].sinOpm) sinOpm++; if(!rows[i].obs||rows[i].obs==='-') sinObs++; if(rows[i].hh>=21||rows[i].hh<7) nohoras++; }
  h+='<div class="card"><h3>Señales de riesgo</h3><ul class="txt" style="margin:8px 0 0;padding-left:18px;line-height:1.7">'+
     '<li><b>'+pocas.length+' sedes</b> con menos de 6 visitas: sus porcentajes no son estadísticamente concluyentes'+(pocas.length?' ('+pocas.slice(0,4).map(function(g){return esc(g.key)+': '+g.n_ev;}).join('; ')+')':'')+'.</li>'+
     '<li><b>'+rec.length+' docentes</b> con más de una visita en el periodo: es la única base disponible para analizar reincidencia real.</li>'+
     '<li><b>'+num(a.n_ev-a.perf)+' visitas</b> con al menos un incumplimiento ('+pct(a.n_ev?(a.n_ev-a.perf)/a.n_ev*100:0)+' del total filtrado).</li>'+
     '<li><b>'+nohoras+' registros</b> guardados fuera del horario laboral habitual (antes de 07:00 o después de 21:00): posible carga diferida del formulario.</li>'+
     '</ul></div>';
  h+='<div class="card"><h3>Calidad del dato</h3><ul class="txt" style="margin:8px 0 0;padding-left:18px;line-height:1.7">'+
     '<li>Sin filas duplicadas ni marcas temporales repetidas en el origen.</li>'+
     '<li><b>'+sinOpm+'</b> visitas sin oportunidad de mejora registrada (campo vacío, «-» o «ninguna»).</li>'+
     '<li><b>'+sinObs+'</b> visitas sin observación registrada.</li>'+
     '<li>Los ítems vacíos corresponden a la ficha que no aplica: cada visita responde 7 criterios (presencial) u 11 (virtual). No son datos faltantes.</li>'+
     '<li>«Tipo de visita» y «Modalidad del curso» no coinciden siempre: hay cursos presenciales supervisados por Teams. Se usa <b>Tipo de visita</b> para elegir la ficha.</li>'+
     '</ul></div>';
  document.getElementById('riesgos').innerHTML=h;
}
</script>
<script>
/* ---------- P2 MARCAS ---------- */
function pg2(rows){
  var gm=groupStats(rows,function(r){return r.marca;}); gm.sort(function(x,y){return y.pct-x.pct;});
  var a=agg(rows);
  kpi('k2',[{k:'Marcas con actividad',v:num(gm.length),d:'En la selección actual'},
    {k:'Marca líder',v:gm.length?gm[0].key:'—',d:gm.length?pct(gm[0].pct)+' de cumplimiento':'', c:'g'},
    {k:'Mayor oportunidad',v:gm.length?gm[gm.length-1].key:'—',d:gm.length?pct(gm[gm.length-1].pct)+' de cumplimiento':'', c:'o'},
    {k:'Brecha entre extremos',v:gm.length>1?(gm[0].pct-gm[gm.length-1].pct).toFixed(1)+' pts':'—',d:'Diferencia líder vs. última'},
    {k:'Cumplimiento global',v:pct(a.pct),d:num(a.items)+' ítems evaluados'}]);
  if(!rows.length) return;
  var cols=[{t:'Marca'},{t:'Visitas',num:1},{t:'Docentes',num:1},{t:'Sedes',num:1},{t:'Ítems',num:1},{t:'Incumpl.',num:1},{t:'% cumplimiento',num:1},{t:'Visitas 100%',num:1},{t:'Oport. mejora',num:1},{t:'Semáforo'}];
  document.getElementById('tblMarca').innerHTML=tbl(cols, gm.map(function(g){
    return ['<span class="dot" style="background:'+bcol(g.key)+'"></span><b>'+esc(g.key)+'</b>',num(g.n_ev),num(g.docs),num(g.sedes),num(g.items),'<span style="color:'+SEM[3].col+'">'+num(g.nocumple)+'</span>',barCell(g.pct),num(g.perf)+' ('+pct(g.perf/g.n_ev*100,0)+')',num(g.opor),semTag(g.pct)];}));
  /* marca x tipo */
  var tipos=['Presencial','Virtual'];
  chart('c_marcaTipo',{type:'bar',data:{labels:gm.map(function(g){return g.key;}),datasets:tipos.map(function(t,i){
      return {label:'Clase '+t.toLowerCase(),data:gm.map(function(g){var r=g.rows.filter(function(x){return x.tipo===t;}),c=0,tt=0,j;
        for(j=0;j<r.length;j++){c+=r[j].c;tt+=r[j].t;} return tt?c/tt*100:null;}),
        backgroundColor:i===0?'#2E4A6B':'#8FB4DE',borderRadius:4,barPercentage:.8};})},
    options:{scales:{y:{min:60,max:100,grid:GRID.grid,border:{display:false},ticks:{callback:function(v){return v+'%';},font:{size:10}}},x:GRIDX},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}},datalabels:{display:true,anchor:'end',align:'top',offset:-1,color:'#3A4757',font:{size:10,weight:'600'},formatter:function(v){return v===null?'':v.toFixed(1);}}}}});
  /* radar por marca */
  chart('c_marcaRadar',{type:'radar',data:{labels:DIMS,datasets:gm.map(function(g){var ds=dimStats(g.rows);
      return {label:g.key,data:DIMS.map(function(d){var f=ds.filter(function(x){return x.dim===d;}); return f.length?f[0].pct:null;}),
        borderColor:bcol(g.key),backgroundColor:hexa(bcol(g.key),.10),pointBackgroundColor:bcol(g.key),borderWidth:2,pointRadius:3};})},
    options:{scales:{r:{min:50,max:100,ticks:{stepSize:10,font:{size:9},backdropColor:'transparent'},pointLabels:{font:{size:10}},grid:{color:'#E8EDF4'},angleLines:{color:'#E8EDF4'}}},plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}}}}});
  /* trend por marca */
  var meses=uniq(rows.map(function(r){return r.ym;})).sort();
  chart('c_marcaTrend',{type:'line',data:{labels:meses,datasets:gm.map(function(g){
      return {label:g.key,data:meses.map(function(m){var r=g.rows.filter(function(x){return x.ym===m;}),c=0,tt=0,j;
        for(j=0;j<r.length;j++){c+=r[j].c;tt+=r[j].t;} return tt?c/tt*100:null;}),
        borderColor:bcol(g.key),backgroundColor:bcol(g.key),tension:.3,borderWidth:2.5,pointRadius:3,spanGaps:true};})},
    options:{scales:{y:{min:60,max:100,grid:GRID.grid,border:{display:false},ticks:{callback:function(v){return v+'%';},font:{size:10}}},x:GRIDX},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}}}}});
  /* heat criterio x marca */
  var mk=gm.map(function(g){return g.key;});
  var mat=CRIT.map(function(c){ return mk.map(function(m){ var g=gm.filter(function(x){return x.key===m;})[0], cu=0,nc=0,j;
      for(j=0;j<g.rows.length;j++){ var v=g.rows[j].it[c.code]; if(v===1)cu++; else if(v===0)nc++; } return (cu+nc)?cu/(cu+nc)*100:null; }); });
  heatTable(CRIT.map(function(c){return c.code+' · '+c.label;}), mk, mat, 'hmMarca', false);
  /* ranking */
  var h='',i;
  for(i=0;i<gm.length;i++){ var g=gm[i];
    h+='<div class="i" style="border-left-color:'+bcol(g.key)+'"><div class="lb">Puesto '+(i+1)+'</div><div class="tx"><b>'+esc(g.key)+'</b> — '+pct(g.pct)+' de cumplimiento ponderado</div><div class="ev">'+num(g.n_ev)+' visitas · '+num(g.docs)+' docentes · '+num(g.sedes)+' sedes · '+num(g.perf)+' visitas sin observación ('+pct(g.perf/g.n_ev*100,0)+') · '+num(g.nocumple)+' incumplimientos</div></div>'; }
  document.getElementById('rankMarca').innerHTML=h;
}

/* ---------- P3 SEDES ---------- */
function pg3(rows){
  var gs=groupStats(rows,function(r){return r.sede+' ('+r.marca+')';});
  gs.sort(function(x,y){return x.pct-y.pct;});
  var conEv=gs.filter(function(g){return g.n_ev>=8;});
  kpi('k3',[{k:'Sedes con actividad',v:num(gs.length),d:'Combinación sede–marca'},

<script>
/* ---------- P4 DOCENTES ---------- */

  var colsB=[{t:'Docente'},{t:'Marca'},{t:'Sede'},{t:'Visita'},{t:'Fecha'},{t:'Cumpl.',num:1},{t:'Criterios incumplidos'},{t:'Nivel'}];

        d>0?'<span style="color:'+SEM[0].col+'">▲ mejora '+d.toFixed(0)+' pts</span>':(d<0?'<span style="color:'+SEM[3].col+'">▼ retrocede '+Math.abs(d).toFixed(0)+' pts</span>':'Estable')];})); }
  document.getElementById('recurrencia').innerHTML=h;

/* ---------- P5 CRITERIOS ---------- */
function pg5(rows){

  var mods=['Presencial','Virtual'];

        for(ii=0;ii<CRIT.length;ii++){ if(CRIT[ii].dim!==DIMS[kdim]||CRIT[ii].mod!==m) continue;

    options:{scales:{r:{min:50,max:100,ticks:{stepSize:10,font:{size:9},backdropColor:'transparent'},pointLabels:{font:{size:10}},grid:{color:'#E8EDF4'},angleLines:{color:'#E8EDF4'}}},plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}}}}});

  var mat=gs.map(function(g){ return CRIT.map(function(c){ var cu=0,nc=0,j;

<script>
/* ---------- P6 HALLAZGOS ---------- */
function pg6(rows){
  var a=agg(rows), tem=temaStats(rows), i;
  kpi('k6',[{k:'Visitas con hallazgo positivo',v:num(a.hall),d:pct(a.n_ev?a.hall/a.n_ev*100:0)+' de las visitas',c:'g'},
    {k:'Con oportunidad de mejora',v:num(a.opor),d:pct(a.n_ev?a.opor/a.n_ev*100:0)+' de las visitas',c:'o'},
    {k:'Con compromiso docente',v:num(a.comp),d:pct(a.opor?a.comp/a.opor*100:0)+' de las oportunidades'},

    {k:'Temas identificados',v:num(tem.length),d:'Derivados del texto real'},
    {k:'Tema más frecuente',v:tem.length?num(tem[0].n):'—',d:tem.length?esc(tem[0].tema):'',c:'r'}]);
  if(!rows.length) return;
  chart('c_temas',{type:'bar',data:{labels:tem.map(function(t){return t.tema;}),datasets:[{data:tem.map(function(t){return t.n;}),
      backgroundColor:'#3A6EA5',borderRadius:3,barPercentage:.75}]},
    options:{indexAxis:'y',scales:{x:{grid:GRID.grid,border:{display:false},ticks:{font:{size:10}}},y:{grid:{display:false},border:{display:false},ticks:{font:{size:10.5}}}},
      plugins:{legend:{display:false},datalabels:{display:true,anchor:'end',align:'right',offset:3,color:'#3A4757',font:{size:10,weight:'600'},
        formatter:function(v){return v+' ('+(v/rows.length*100).toFixed(0)+'%)';}}},
      onClick:function(e,el){ if(el.length) showTema(rows, tem[el[0].index].tema); }}});
  var mk=uniq(rows.map(function(r){return r.marca;})).sort();
  var mat=tem.map(function(t){ return mk.map(function(m){ return t.marca[m]||0; }); });
  var h='<table class="hm"><thead><tr><th></th>'; for(i=0;i<mk.length;i++) h+='<th>'+esc(mk[i])+'</th>'; h+='</tr></thead><tbody>';
  var mx=1,r2,c2; for(r2=0;r2<mat.length;r2++) for(c2=0;c2<mat[r2].length;c2++) if(mat[r2][c2]>mx) mx=mat[r2][c2];
  for(r2=0;r2<mat.length;r2++){ h+='<tr><th>'+esc(tem[r2].tema)+'</th>';
    for(c2=0;c2<mk.length;c2++){ var v=mat[r2][c2]; h+='<td style="background:'+(v?hexa('#3A6EA5',.08+.5*(v/mx)):'#F7F9FB')+';color:'+(v/mx>.55?'#fff':'#22303F')+'">'+(v||'—')+'</td>'; }
    h+='</tr>'; }
  document.getElementById('hmTema').innerHTML=h+'</tbody></table>';

  for(i=0;i<rows.length;i++){ var r=rows[i];
    if(r.hal&&r.hal!=='-'&&r.hal.toLowerCase().indexOf('ningun')!==0) cnt.hal++;
    if(!r.sinOpm) cnt.opm++;
    if(r.obs&&r.obs!=='-'&&r.obs.toLowerCase().indexOf('ningun')!==0) cnt.obs++;
    if(r.com&&r.com!=='-'&&r.com.toLowerCase().indexOf('ningun')!==0) cnt.com++; }
  chart('c_texto',{type:'bar',data:{labels:['Hallazgos positivos','Oportunidades de mejora','Observación','Compromiso del docente'],
    datasets:[{label:'Con registro',data:[cnt.hal,cnt.opm,cnt.obs,cnt.com],backgroundColor:'#2E4A6B',borderRadius:3,barPercentage:.6,stack:'s'},
      {label:'Sin registro',data:[rows.length-cnt.hal,rows.length-cnt.opm,rows.length-cnt.obs,rows.length-cnt.com],backgroundColor:'#E3E9F0',borderRadius:3,barPercentage:.6,stack:'s'}]},
    options:{indexAxis:'y',scales:{x:{stacked:true,grid:GRID.grid,border:{display:false},ticks:{font:{size:10}}},y:{stacked:true,grid:{display:false},border:{display:false},ticks:{font:{size:10.5}}}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}},
        datalabels:{display:function(c){return c.datasetIndex===0;},color:'#fff',anchor:'center',font:{size:10,weight:'600'},formatter:function(v){return v+' ('+(v/rows.length*100).toFixed(0)+'%)';}}}}});
  showTema(rows, tem.length?tem[0].tema:null);
  bindTexto(rows);
}
function showTema(rows,tema){
  var el=document.getElementById('cardTemaDetalle'); if(!el) return;
  if(!tema){ el.innerHTML='<h3>Detalle del tema</h3><p class="hint">Sin temas detectados.</p>'; return; }
  var rs=rows.filter(function(r){ return r.tm.indexOf(tema)>=0; });
  var a=agg(rs), aa=agg(rows);
  var gm=groupStats(rs,function(r){return r.marca;}).sort(function(x,y){return y.n_ev-x.n_ev;});
  var gsd=groupStats(rs,function(r){return r.sede;}).sort(function(x,y){return y.n_ev-x.n_ev;}).slice(0,5);
  var ej=rs.filter(function(r){return !r.sinOpm;}).slice(0,3);
  var h='<h3>Detalle · '+esc(tema)+'</h3><p class="hint">Clic en otra barra del ranking para cambiar de tema.</p>';
  h+='<div class="txt" style="line-height:1.7"><b>'+num(rs.length)+' visitas</b> mencionan este tema ('+pct(rows.length?rs.length/rows.length*100:0)+' de la selección).<br>'+
     'Cumplimiento de esas visitas: <b style="color:'+sem(a.pct).col+'">'+pct(a.pct)+'</b> frente a '+pct(aa.pct)+' del conjunto.<br>'+
     'Marcas: '+gm.map(function(g){return esc(g.key)+' ('+g.n_ev+')';}).join(' · ')+'<br>'+
     'Sedes más afectadas: '+(gsd.length?gsd.map(function(g){return esc(g.key)+' ('+g.n_ev+')';}).join(' · '):'—')+'</div>';
  if(ej.length){ h+='<div style="margin-top:10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:600">Textos de ejemplo</div>';
    for(var i=0;i<ej.length;i++) h+='<div style="font-size:11.5px;line-height:1.5;color:var(--ink2);border-left:2px solid var(--line);padding:6px 0 6px 9px;margin-top:6px">'+esc(ej[i].opm.length>240?ej[i].opm.substr(0,240)+'…':ej[i].opm)+'</div>'; }
  el.innerHTML=h;

function bindTexto(rows){
  var q=document.getElementById('qTexto'), c=document.getElementById('qCampo');
  function run(){
    var term=q.value.toUpperCase(), campo=c.value;
    var rs=rows.filter(function(r){ var t=(r[campo]||''); return t && t!=='-' && (!term || t.toUpperCase().indexOf(term)>=0); });
    document.getElementById('tblTexto').innerHTML=tbl([{t:'Fecha'},{t:'Marca'},{t:'Sede'},{t:'Docente'},{t:'Visita'},{t:'Cumpl.',num:1},{t:'Texto'}],
      rs.slice(0,150).map(function(r){ return [r.ts,'<span class="dot" style="background:'+bcol(r.marca)+'"></span>'+esc(r.marca),esc(r.sede),esc(r.doc),r.tipo,
        '<span class="mono" style="color:'+sem(r.s).col+';font-weight:600">'+pct(r.s,0)+'</span>','<span style="font-size:11.5px;line-height:1.5">'+esc(r[campo])+'</span>'];}))
      + '<p class="hint" style="margin:8px 0 0">'+rs.length+' registros coinciden'+(rs.length>150?' · se muestran los primeros 150':'')+'.</p>';
  }
  q.onkeyup=run; c.onchange=run; run();
}

/* ---------- P7 SUPERVISIÓN ---------- */
function pg7(rows){
  var gs=groupStats(rows,function(r){return r.sup;}).sort(function(x,y){return y.n_ev-x.n_ev;}),i;
  var a=agg(rows);
  var mediana=(function(){ var v=gs.map(function(g){return g.n_ev;}).sort(function(x,y){return x-y;}); if(!v.length) return 0;
    return v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2; })();
  var top3=gs.slice(0,3).reduce(function(s,g){return s+g.n_ev;},0);
  kpi('k7',[{k:'Supervisores activos',v:num(gs.length),d:'En la selección actual'},
    {k:'Visitas registradas',v:num(a.n_ev),d:'Total del periodo filtrado'},
    {k:'Mediana de visitas',v:num(mediana),d:'Por supervisor'},
    {k:'Concentración top 3',v:pct(a.n_ev?top3/a.n_ev*100:0,0),d:'Visitas de los 3 más activos',c:(a.n_ev&&top3/a.n_ev>0.5)?'o':''},
    {k:'Sedes cubiertas',v:num(a.sedes),d:num(a.marcas)+' marcas'},
    {k:'Cobertura virtual',v:pct(a.n_ev?(rows.filter(function(r){return r.tipo==='Virtual';}).length/a.n_ev*100):0,0),d:'Visitas por Teams'}]);
  if(!rows.length) return;
  chart('c_supBar',{type:'bar',data:{labels:gs.map(function(g){return g.key;}),datasets:[
      {label:'Presencial',data:gs.map(function(g){return g.rows.filter(function(r){return r.tipo==='Presencial';}).length;}),backgroundColor:'#2E4A6B',borderRadius:3,stack:'s'},
      {label:'Virtual',data:gs.map(function(g){return g.rows.filter(function(r){return r.tipo==='Virtual';}).length;}),backgroundColor:'#8FB4DE',borderRadius:3,stack:'s'}]},
    options:{indexAxis:'y',scales:{x:{stacked:true,grid:GRID.grid,border:{display:false},ticks:{font:{size:10}}},y:{stacked:true,grid:{display:false},border:{display:false},ticks:{font:{size:10.5}}}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10.5}}},datalabels:{display:function(c){return c.dataset.data[c.dataIndex]>0;},color:'#fff',font:{size:9.5,weight:'600'}}},
      onClick:function(e,el){ if(el.length) setF('sup', gs[el[0].index].key); }}});
  var meses=uniq(rows.map(function(r){return r.ym;})).sort();
  var palSup=['#2E4A6B','#E5591D','#3A9E6C','#B4478E','#D6A31C','#5B7A9B','#8A5CD1','#C24545',
              '#1E9AA8','#7A8B3F','#D1739B','#4A6FD6','#A0522D','#00857A','#9B7BC8','#B5651D'];
  chart('c_supTrend',{type:'line',data:{labels:meses,datasets:gs.map(function(g,i){
      return {label:g.key,data:meses.map(function(m){return g.rows.filter(function(r){return r.ym===m;}).length;}),
        borderColor:palSup[i%palSup.length],backgroundColor:palSup[i%palSup.length],
        borderDash:i>=palSup.length?[5,3]:[],tension:0,borderWidth:2,pointRadius:2.5,pointHoverRadius:5};})},
    options:{scales:{y:{beginAtZero:true,grid:GRID.grid,border:{display:false},ticks:{font:{size:10},precision:0}},x:GRIDX},
      plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,font:{size:10},padding:7}},
        tooltip:{mode:'index',intersect:false,itemSort:function(a,b){return b.parsed.y-a.parsed.y;},
          filter:function(c){return c.parsed.y>0;}}}}});
  document.getElementById('tblSup').innerHTML=tbl([{t:'Supervisor'},{t:'Visitas',num:1},{t:'Docentes',num:1},{t:'Sedes',num:1},{t:'Marcas',num:1},{t:'Presencial',num:1},{t:'Virtual',num:1},{t:'% visitas virtuales',num:1},{t:'Cumplimiento de los docentes visitados',num:1},{t:'Actividad'}],
    gs.map(function(g){ var v=g.rows.filter(function(r){return r.tipo==='Virtual';}).length;
      return ['<b>'+esc(g.key)+'</b>',num(g.n_ev),num(g.docs),num(g.sedes),num(g.marcas),num(g.n_ev-v),num(v),'<span class="mono">'+pct(g.n_ev?v/g.n_ev*100:0,0)+'</span>','<span class="mono" style="color:var(--muted)">'+pct(g.pct)+'</span>',
        g.n_ev>=mediana?'<span class="tag t-exc">Sobre la mediana</span>':'<span class="tag t-seg">Bajo la mediana</span>'];}));
  var poc=gs.filter(function(g){return g.n_ev<mediana*0.6;});
  var monoSede=gs.filter(function(g){return g.sedes===1;});
  var h='<div class="card"><h3>Concentración de la carga</h3><ul class="txt" style="margin:8px 0 0;padding-left:18px;line-height:1.7">'+
    '<li>Los 3 supervisores más activos concentran <b>'+pct(top3/a.n_ev*100,0)+'</b> de las visitas.</li>'+
    '<li><b>'+poc.length+'</b> supervisores por debajo del 60% de la mediana ('+num(mediana)+' visitas): '+(poc.length?poc.map(function(g){return esc(g.key)+' ('+g.n_ev+')';}).join(', '):'ninguno')+'.</li>'+
    '<li>La diferencia entre el supervisor más y menos activo es de <b>'+(gs[0].n_ev-gs[gs.length-1].n_ev)+' visitas</b>.</li></ul></div>';
  h+='<div class="card"><h3>Cobertura</h3><ul class="txt" style="margin:8px 0 0;padding-left:18px;line-height:1.7">'+
    '<li><b>'+monoSede.length+'</b> supervisores trabajan sobre una sola sede: '+(monoSede.length?monoSede.map(function(g){return esc(g.key)+' → '+esc(g.rows[0].sede);}).join(', '):'ninguno')+'.</li>'+
    '<li>La mezcla presencial/virtual varía fuertemente entre supervisores, lo que explica buena parte de las diferencias de cumplimiento observadas y confirma que <b>ese indicador no mide al supervisor</b>.</li>'+
    '<li>Rango de % de visitas virtuales: de '+pct(Math.min.apply(null,gs.map(function(g){return g.rows.filter(function(r){return r.tipo==='Virtual';}).length/g.n_ev*100;})),0)+' a '+pct(Math.max.apply(null,gs.map(function(g){return g.rows.filter(function(r){return r.tipo==='Virtual';}).length/g.n_ev*100;})),0)+'.</li></ul></div>';
  document.getElementById('supRiesgo').innerHTML=h;
}

/* ---------- LIVE RELOAD ---------- */
function reloadSheet(){
  var b=document.getElementById('btnReload'); b.textContent='Cargando…'; b.disabled=true;
  var cb='gvizCb'+Date.now();
  window[cb]=function(resp){
    try{
      var t=resp.table, rowsN=[], i, j, cols=t.cols.map(function(c){return (c.label||'').trim();});
      for(i=0;i<t.rows.length;i++){ var o={}, cells=t.rows[i].c;
        for(j=0;j<cols.length;j++) o[cols[j]] = (cells[j] && cells[j].v!==null && cells[j].v!==undefined) ? String(cells[j].f||cells[j].v).trim() : '';
        rowsN.push(o); }
      var conv=mapRows(rowsN);
      if(conv.length){ RAW=conv; DB.data=conv; document.getElementById('footRows').innerHTML=RAW.length+' visitas · actualizado ahora'; buildFilters(); render();
        b.textContent='Actualizado ('+RAW.length+' visitas)'; }
      else b.textContent='Sin filas nuevas';
    }catch(e){ b.textContent='No se pudo leer la hoja'; }
    b.disabled=false; setTimeout(function(){b.textContent='Actualizar desde Google Sheets';},4000);
  };
  var s=document.createElement('script');
  s.src='https://docs.google.com/spreadsheets/d/'+META.sheetId+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&gid='+META.gid+'&headers=1';
  s.onerror=function(){ b.textContent='Sin acceso público a la hoja'; b.disabled=false;
    setTimeout(function(){b.textContent='Actualizar desde Google Sheets';},4000); };
  document.body.appendChild(s);
}
var COLMAP={ts:'Marca temporal',marca:'Marca:',sup:'(Supervisor) Nombre:',doc:'(Docente) Apellidos y Nombre:',cod:'Código del Curso:',
  tipoV:'Tipo de Visita:',obs:'Observación',hal:'Hallazgos positivos',opm:'Oportunidades de mejora',com:'Compromiso del docente',
  sede:'Sede Docente',prog:'Programa',per:'Periodo',curso:'Curso',ciclo:'Priodo',carrera:'Carrera',mod:'Modalidad'};
var TEMAKW=META.temaKw||{}; var CRITCOLS=META.critCols||[];
function nrm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function mapRows(list){
  var out=[],i,j;
  var critCols = CRITCOLS;
  for(i=0;i<list.length;i++){
    var r=list[i]; if(!r[COLMAP.marca]) continue;
    var it={},c=0,n=0;
    for(j=0;j<critCols.length;j++){ var v=r[critCols[j]]; if(v==='Cumple'){it[CRIT[j].code]=1;c++;} else if(v==='No cumple'){it[CRIT[j].code]=0;n++;} }
    var t=c+n; if(!t) continue;
    var ts=parseFecha(r[COLMAP.ts]);
    var base=nrm((r[COLMAP.opm]||'')+' || '+(r[COLMAP.obs]||''));
    var tm=[],k;
    for(k in TEMAKW){ var kws=TEMAKW[k],f=false,z; for(z=0;z<kws.length;z++) if(base.indexOf(kws[z])>=0){f=true;break;} if(f) tm.push(k); }
    var opm=(r[COLMAP.opm]||'').trim();
    out.push({ts:ts.d,ym:ts.m,hh:ts.h,marca:(r[COLMAP.marca]||'').trim(),sup:(r[COLMAP.sup]||'').trim(),doc:(r[COLMAP.doc]||'').trim().toUpperCase(),
      cod:(r[COLMAP.cod]||'').trim(),tipo:((r[COLMAP.tipoV]||'').indexOf('VIRTUAL')>=0?'Virtual':'Presencial'),sede:(r[COLMAP.sede]||'').trim(),
      prog:(r[COLMAP.prog]||'').trim(),per:(r[COLMAP.per]||'').trim(),curso:(r[COLMAP.curso]||'').trim(),ciclo:(r[COLMAP.ciclo]||'').trim(),
      carrera:(r[COLMAP.carrera]||'').trim(),mod:(r[COLMAP.mod]||'').trim(),it:it,c:c,n:n,t:t,s:c/t*100,
      obs:(r[COLMAP.obs]||'').trim(),hal:(r[COLMAP.hal]||'').trim(),opm:opm,com:(r[COLMAP.com]||'').trim(),tm:tm,
      sinOpm:(['','-','--','.','ninguna','ninguno','n/a','na','nada'].indexOf(nrm(opm))>=0)?1:0});
  }
  return out;
}
function parseFecha(s){
  s=String(s||'');
  var m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]*(\d{1,2})?:?(\d{2})?/);
  if(m){ var d=('0'+m[1]).slice(-2), mo=('0'+m[2]).slice(-2);
    return {d:m[3]+'-'+mo+'-'+d, m:m[3]+'-'+mo, h:parseInt(m[4]||'12',10)}; }
  var m2=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return {d:m2[0], m:m2[1]+'-'+m2[2], h:12};
  return {d:'', m:'', h:12};
}
